<rect class="b-def" x="624" y="272" width="160" height="80" rx="4"/>
<text class="tm" x="636" y="296" font-size="12">заборонити камері</text>
<text class="tm" x="636" y="314" font-size="12">виходити назовні,</text>
<text class="tm" x="636" y="332" font-size="12">стежити за мережею</text>
<text class="k td" x="212" y="376" font-size="11">ТУТ ЗУПИНИТИ НАЙДЕШЕВШЕ</text>
