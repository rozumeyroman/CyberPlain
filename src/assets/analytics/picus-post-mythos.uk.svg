<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392">
<text class="tm" x="16" y="30" font-size="16" font-weight="600">12 рекомендацій у чотирьох темах</text>
<rect class="b-out" x="16" y="48" width="180" height="292" rx="6"/>
<text class="k td" x="28" y="72" font-size="11">ТЕМА 1</text>
<text class="tm" x="28" y="92" font-size="14" font-weight="600">Перевірити</text>
<rect class="b-def" x="24" y="108" width="164" height="66" rx="4"/>
<text class="k" x="36" y="128" font-size="11">01</text>
<text class="tm" x="36" y="148" font-size="12">Пріоритети експозицій</text>
<text class="ts" x="36" y="164" font-size="12">з контекстом</text>
<rect class="b-def" x="24" y="184" width="164" height="66" rx="4"/>
<text class="k" x="36" y="204" font-size="11">02</text>
<text class="tm" x="36" y="224" font-size="12">Постійна перевірка</text>
<text class="ts" x="36" y="240" font-size="12">засобів захисту</text>
<rect class="b-def" x="24" y="260" width="164" height="66" rx="4"/>
<text class="k" x="36" y="280" font-size="11">03</text>
<text class="tm" x="36" y="300" font-size="12">Віртуальне латання</text>
<text class="ts" x="36" y="316" font-size="12">як дисципліна</text>
<rect class="b-out" x="212" y="48" width="180" height="292" rx="6"/>
<text class="k td" x="224" y="72" font-size="11">ТЕМА 2</text>
<text class="tm" x="224" y="92" font-size="14" font-weight="600">Виявляти й реагувати</text>
<rect class="b-def" x="220" y="108" width="164" height="66" rx="4"/>
<text class="k" x="232" y="128" font-size="11">04</text>
<text class="tm" x="232" y="148" font-size="12">Поведінкове виявлення</text>
<text class="ts" x="232" y="164" font-size="12">й автоматичні дії</text>
<rect class="b-def" x="220" y="184" width="164" height="66" rx="4"/>
<text class="k" x="232" y="204" font-size="11">05</text>
<text class="tm" x="232" y="224" font-size="12">SOC і управління</text>
<text class="ts" x="232" y="240" font-size="12">експозиціями</text>
<rect class="b-def" x="220" y="260" width="164" height="66" rx="4"/>
<text class="k" x="232" y="280" font-size="11">06</text>
<text class="tm" x="232" y="300" font-size="12">Результати перевірок</text>
<text class="ts" x="232" y="316" font-size="12">як розвідка</text>
<rect class="b-out" x="408" y="48" width="180" height="292" rx="6"/>
<text class="k td" x="420" y="72" font-size="11">ТЕМА 3</text>
<text class="tm" x="420" y="92" font-size="14" font-weight="600">Зміцнити</text>
<rect class="b-def" x="416" y="108" width="164" height="66" rx="4"/>
<text class="k" x="428" y="128" font-size="11">07</text>
<text class="tm" x="428" y="148" font-size="12">Обмежити радіус</text>
<text class="ts" x="428" y="164" font-size="12">ураження</text>
<rect class="b-def" x="416" y="184" width="164" height="66" rx="4"/>
<text class="k" x="428" y="204" font-size="11">08</text>
<text class="tm" x="428" y="224" font-size="12">Скоротити й зміцнити</text>
<text class="ts" x="428" y="240" font-size="12">поверхню атаки</text>
<rect class="b-def" x="416" y="260" width="164" height="66" rx="4"/>
<text class="k" x="428" y="280" font-size="11">09</text>
<text class="tm" x="428" y="300" font-size="12">Захистити</text>
<text class="ts" x="428" y="316" font-size="12">ШІ-агентів</text>
<rect class="b-out" x="604" y="48" width="180" height="292" rx="6"/>
<text class="k td" x="616" y="72" font-size="11">ТЕМА 4</text>
<text class="tm" x="616" y="92" font-size="14" font-weight="600">Організуватися</text>
<rect class="b-def" x="612" y="108" width="164" height="66" rx="4"/>
<text class="k" x="624" y="128" font-size="11">10</text>
<text class="tm" x="624" y="148" font-size="12">Метрики ризику</text>
<text class="ts" x="624" y="164" font-size="12">для керівництва</text>
<rect class="b-def" x="612" y="184" width="164" height="66" rx="4"/>
<text class="k" x="624" y="204" font-size="11">11</text>
<text class="tm" x="624" y="224" font-size="12">Підготуватися</text>
<text class="ts" x="624" y="240" font-size="12">до хвилі Glasswing</text>
<rect class="b-def" x="612" y="260" width="164" height="66" rx="4"/>
<text class="k" x="624" y="280" font-size="11">12</text>
<text class="tm" x="624" y="300" font-size="12">Колективний захист</text>
<text class="ts" x="624" y="316" font-size="12">у спільнотах</text>
<line class="lg" x1="16" y1="356" x2="784" y2="356"/>
<text class="ts" x="16" y="378" font-size="13">Спільна ідея: кожен захід доводять перевіркою, а не припускають</text>
</svg>
