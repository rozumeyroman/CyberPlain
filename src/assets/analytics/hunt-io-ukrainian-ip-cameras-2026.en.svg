<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 432">
<defs>
<marker id="ipc-ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fa" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ipc-md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fd" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="tm" x="16" y="28" font-size="16" font-weight="600">Three doors into a camera and four lines of defence</text>
<rect class="b-att" x="16" y="80" width="144" height="96" rx="4"/>
<text class="k ta" x="28" y="104" font-size="11">SCANNER</text>
<text class="tm" x="28" y="126" font-size="12">sweeps addresses</text>
<text class="tm" x="28" y="142" font-size="12">of whole cities</text>
<text class="ts" x="28" y="164" font-size="11">camview (Ingram)</text>
<line class="la" x1="160" y1="128" x2="198" y2="128" marker-end="url(#ipc-ma)"/>
<text class="ts" x="179" y="148" font-size="11" text-anchor="middle">scans</text>
<rect class="b-out" x="200" y="48" width="376" height="136" rx="6"/>
<text class="k" x="212" y="70" font-size="11">CAMERA / ROUTER</text>
<text class="ts" x="564" y="70" font-size="11" text-anchor="end">tries three doors</text>
<rect class="b-att" x="212" y="88" width="112" height="80" rx="4"/>
<text class="k ta" x="222" y="110" font-size="11">DOOR 1</text>
<text class="tm" x="222" y="134" font-size="12">visible from</text>
<text class="tm" x="222" y="152" font-size="12">the internet</text>
<rect class="b-att" x="332" y="88" width="112" height="80" rx="4"/>
<text class="k ta" x="342" y="110" font-size="11">DOOR 2</text>
<text class="tm" x="342" y="134" font-size="12">default</text>
<text class="tm" x="342" y="152" font-size="12">password</text>
<rect class="b-att" x="452" y="88" width="112" height="80" rx="4"/>
<text class="k ta" x="462" y="110" font-size="11">DOOR 3</text>
<text class="tm" x="462" y="134" font-size="12">outdated</text>
<text class="tm" x="462" y="152" font-size="12">firmware</text>
<line class="la" x1="576" y1="104" x2="622" y2="96" marker-end="url(#ipc-ma)"/>
<line class="la dash" x1="576" y1="152" x2="622" y2="192" marker-end="url(#ipc-ma)"/>
<rect class="b-att" x="624" y="56" width="160" height="80" rx="4"/>
<text class="k ta" x="636" y="78" font-size="11">WATCHES</text>
<text class="tm" x="636" y="100" font-size="12">camera video</text>
<text class="ts" x="636" y="122" font-size="11">58 cameras listed</text>
<rect class="b-dash" x="624" y="152" width="160" height="96" rx="4"/>
<text class="k ta" x="636" y="174" font-size="11">PASS-THROUGH</text>
<text class="tm" x="636" y="196" font-size="12">proxy for</text>
<text class="tm" x="636" y="212" font-size="12">others' traffic</text>
<text class="ts" x="636" y="234" font-size="11">prepared only</text>
<text class="k td" x="16" y="288" font-size="11">LINES OF DEFENCE</text>
<text class="ts" x="16" y="308" font-size="11">one opposite</text>
<text class="ts" x="16" y="324" font-size="11">each door</text>
<line class="ld" x1="268" y1="270" x2="268" y2="172" marker-end="url(#ipc-md)"/>
<rect class="b-def" x="212" y="272" width="112" height="80" rx="4"/>
<text class="tm" x="222" y="296" font-size="12">take it off</text>
<text class="tm" x="222" y="314" font-size="12">the internet,</text>
<text class="tm" x="222" y="332" font-size="12">access via VPN</text>
<line class="ld" x1="388" y1="270" x2="388" y2="172" marker-end="url(#ipc-md)"/>
<rect class="b-def" x="332" y="272" width="112" height="80" rx="4"/>
<text class="tm" x="342" y="296" font-size="12">own password</text>
<text class="tm" x="342" y="314" font-size="12">on every</text>
<text class="tm" x="342" y="332" font-size="12">device</text>
<line class="ld" x1="508" y1="270" x2="508" y2="172" marker-end="url(#ipc-md)"/>
<rect class="b-def" x="452" y="272" width="112" height="80" rx="4"/>
<text class="tm" x="462" y="296" font-size="12">update</text>
<text class="tm" x="462" y="314" font-size="12">firmware</text>
<line class="ld" x1="704" y1="270" x2="704" y2="252" marker-end="url(#ipc-md)"/>
<rect class="b-def" x="624" y="272" width="160" height="80" rx="4"/>
<text class="tm" x="636" y="296" font-size="12">block cameras from</text>
<text class="tm" x="636" y="314" font-size="12">going outbound,</text>
<text class="tm" x="636" y="332" font-size="12">watch the network</text>
<text class="k td" x="212" y="376" font-size="11">CHEAPEST PLACE TO STOP</text>
<line class="la" x1="16" y1="408" x2="48" y2="408"/>
<text class="ts" x="56" y="412" font-size="11">traces in the operator's folder</text>
<line class="la dash" x1="352" y1="408" x2="384" y2="408"/>
<text class="ts" x="392" y="412" font-size="11">prepared only, success not confirmed</text>
</svg>
