# Snyk для CyberPlain: Snyk Code (SAST) + Snyk Open Source (залежності npm).
# IaC і Container прибрані: у репо немає Dockerfile і IaC-файлів, ці кроки лише падали б.
# Усі actions закріплені за SHA комітів (захист від підміни тегів, як у tj-actions / wfx-loot).

name: Snyk Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * 1" # щопонеділка: нові CVE в уже наявних залежностях

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # завантаження SARIF у Security → Code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

      # Знахідки дають exit 1 — не валимо job, щоб SARIF усе одно потрапив у GitHub.
      - name: Snyk Code test (SAST)
        run: snyk code test --sarif-file-output=snyk-code.sarif
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk Code results to GitHub Code Scanning
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      # PR: перевірка залежностей, падає лише на high/critical.
      - name: Snyk Open Source test (PR)
        if: github.event_name == 'pull_request'
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # main і розклад: знімок залежностей у Snyk, звідти приходять сповіщення про нові CVE.
      - name: Snyk Open Source monitor
        if: github.event_name != 'pull_request'
        run: snyk monitor --project-name=cyberplain
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
